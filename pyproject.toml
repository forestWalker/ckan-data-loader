[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ckan-exports"
version = "0.1.0"
description = "Standardized CKAN export pipelines reading from Scorpio (NGSI-LD) or directly from the OVAK API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.scripts]
ckan-exports = "core.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "exports*"]
